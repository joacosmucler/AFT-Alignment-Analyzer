[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aft-gui"
version = "0.2.0"
description = "Desktop GUI for cytoskeletal alignment quantification by Fourier Transform (AFT)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Joaquín Smucler" }]
keywords = ["microscopy", "image analysis", "cytoskeleton", "alignment", "fourier transform", "AFT"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Environment :: X11 Applications :: Qt",
]

[project.urls]
Homepage = "https://github.com/joacosmucler/AFT-Alignment-Analyzer"
Releases = "https://github.com/joacosmucler/AFT-Alignment-Analyzer/releases"
dependencies = [
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.7",
    "tifffile>=2023.1",
    "aicspylibczi>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
aft-gui = "aft_gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aft_gui"]
