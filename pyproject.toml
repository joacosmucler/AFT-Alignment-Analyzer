[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aft-gui"
version = "0.2.0"
description = "Desktop GUI for cytoskeletal alignment quantification by Fourier Transform (AFT)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.7",
    "tifffile>=2023.1",
    "aicspylibczi>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
web = ["streamlit>=1.40", "plotly>=5.18"]

[project.gui-scripts]
aft-gui = "aft_gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aft_gui"]
